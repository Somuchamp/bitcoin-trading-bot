version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: python -m src.prediction.worker
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    env_file:
      - .env
    depends_on:
      - api

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
